name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and Build
        run: |
          # 嚴格 npm ci：lock file 不同步時必須失敗。先前的 `npm ci || npm install`
          # 會讓 Deploy 靜默改用 npm install 而綠燈通過，導致 CI 已紅、
          # 線上卻部署了未經 CI 驗證的依賴樹（2026-08-02 即發生過）。
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
